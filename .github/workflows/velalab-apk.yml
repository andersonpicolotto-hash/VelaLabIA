name: VelaLab IA - importar codigo e gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VelaLabIA-Completo-Base.zip"
      - ".github/workflows/velalab-apk.yml"
      - "android/**"
      - "backend/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Importar pacote VelaLab IA
        shell: bash
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "Codigo Android existente; nao reimportar pacote."
            exit 0
          fi
          test -f VelaLabIA-Completo-Base.zip
          mkdir -p _source_import
          unzip -q VelaLabIA-Completo-Base.zip -d _source_import
          test -f _source_import/VelaLabIA/android/settings.gradle.kts
          test -f _source_import/VelaLabIA/backend/requirements-dev.txt
          cp -a _source_import/VelaLabIA/android .
          cp -a _source_import/VelaLabIA/backend .
          cp -a _source_import/VelaLabIA/docs .
          cp -a _source_import/VelaLabIA/.gitignore .
          cp -a _source_import/VelaLabIA/.dockerignore .
          cp -a _source_import/VelaLabIA/compose.yaml .
          cp -a _source_import/VelaLabIA/README.md .
          rm -rf _source_import

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fixar FastAPI na versao validada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/requirements.txt")
          text = p.read_text(encoding="utf-8")
          old = "fastapi>=0.115,<1"
          new = "fastapi==0.128.2"
          if old not in text and new not in text:
              raise SystemExit("Revisar versão do FastAPI antes de continuar")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Testar backend
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend
          python -m pytest -q

      - name: Salvar codigo-fonte organizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android backend docs .gitignore .dockerignore compose.yaml README.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: importar fontes VelaLab IA e laboratorio experimental"
            git push
          fi

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK preinstalado
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Instalar plataforma Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de desenvolvimento
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Gerar checksum SHA256
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > APK-SHA256.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VelaLabIA-APK-Preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30

